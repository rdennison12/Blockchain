[project]
name = "blockchain"
version = "1.1.1"
description = "An updated verison of Blockchain from a UDEMY course."
readme = "README.md"
authors = [
    { name = "Rick Dennison", email = "rdennison12@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "cryptography>=50.0.2",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
blockchain = "blockchain:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
